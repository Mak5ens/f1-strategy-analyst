# Two packages in one distribution (ADR-011):
# - core: the reusable foundation (gateway client, and later retrieval, evaluation, agent graph). Never imports f1.
# - f1: the Formula 1 theme (data, tools, prompts, API). Imports core.
# `f1-ingest` (`just ingest`) loads race data into the lake (f1.data.ingest).
# `f1-corpus` (`just corpus`) indexes the FIA regulations and stewards' decisions in Qdrant (f1.corpus.ingest).
# `uv sync` installs both in .venv from uv.lock; versions are pinned there.

[project]
name = "f1-strategy-analyst"
version = "0.5.0"
description = "An AI agent that writes sourced Formula 1 race strategy debriefs, validated by a human analyst."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1",
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "fastembed>=0.9.0",
    "fastf1>=3.8.3",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "langfuse>=4.9.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.28.0",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
f1-ingest = "f1.data.ingest:main"
f1-corpus = "f1.corpus.ingest:main"
f1-ask = "f1.rag.ask:main"
f1-rag-eval = "f1.rag.evaluate:main"
f1-season-jobs = "f1.jobs.season:main"
f1-eval-dataset = "f1.evals.build:main"
f1-baseline = "f1.baseline.ask:main"
f1-eval = "f1.evals.run:main"
f1-debrief = "f1.agent.cli:main"
f1-debriefs-prepare = "f1.prepare:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3,<2.4",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/f1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -ra"
markers = [
    "integration: needs the local stack (just up), the gateway of llmops-gateway, and the network for the race data",
]
filterwarnings = [
    # FastF1 builds NaT timedeltas without a unit (numpy warns from FastF1 or from pandas); nothing to fix here.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # The unit tests run Qdrant in memory, which has no payload indexes; the real server has them.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The FIA's PDFs have non-breaking spaces and typographic apostrophes: the tests reproduce them on purpose.
"tests/unit/test_corpus_parsing.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# No type information shipped by these packages.
module = ["fastf1.*", "pyarrow.*", "fastembed.*"]
ignore_missing_imports = true
