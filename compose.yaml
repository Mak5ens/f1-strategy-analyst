# The app and its local dependencies: Qdrant (FIA corpus index), PostgreSQL (agent checkpoints, human review log),
# an S3 store for the race data lake (Parquet files, queried with DuckDB), then the API and the front, built from
# their Dockerfiles (the cluster's images).
# The gateway is not here: it runs from llmops-gateway (`just gateway-up` there), and the app calls it on GATEWAY_URL.
# The CLIs (`just ingest`, `just debrief`...) run on the host with `uv run`; so do `just api` and `just web-dev`, with
# reload, on ports of their own.
# Every service restarts with Docker (after a reboot, or a restart of Docker), like the gateway's, until `just down`.
name: f1-strategy-analyst

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - 127.0.0.1:${QDRANT_PORT:-6333}:6333
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image ships without curl or wget: bash's /dev/tcp sends the request.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3
          && grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-f1}
    ports:
      # Not 5432, which a local PostgreSQL install usually holds.
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      # PostgreSQL 18 stores data under /var/lib/postgresql/<major>/, hence the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # S3 store of the race data lake: SeaweedFS in one process, as in llmops-gateway and llmops-platform (ADR-018):
  # MinIO no longer ships images. The key pair from the environment becomes its admin identity; the app creates
  # the bucket on its first write.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY:-f1}
      AWS_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_KEY:?set LAKE_S3_SECRET_KEY in .env}
    ports:
      # Not 8333, which the S3 store of llmops-gateway's Langfuse holds on the host.
      - 127.0.0.1:${LAKE_S3_PORT:-8334}:8333
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The API, configured by .env like the CLIs, with the addresses of the services as the containers see them.
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LAKE_S3_ENDPOINT: http://s3:8333
      # The gateway and its Langfuse, on the host at llmops-gateway's default ports.
      GATEWAY_URL: http://host.docker.internal:4000
      LANGFUSE_HOST: http://host.docker.internal:3100
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      s3: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # The front, its server calling the API inside the compose network.
  web:
    build: web
    environment:
      API_URL: http://api:8000
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  qdrant-data:
  postgres-data:
  s3-data:
