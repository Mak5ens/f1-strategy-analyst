# Local dependencies of the app: Qdrant (FIA corpus index), PostgreSQL (agent checkpoints, human review log)
# and an S3 store for the race data lake (Parquet files, queried with DuckDB).
# The gateway is not here: it runs from llmops-gateway (`just gateway-up` there), and the app calls it on GATEWAY_URL.
# The app itself runs on the host with `uv run` during development; the Dockerfile is for the cluster.
name: f1-strategy-analyst

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    ports:
      - 127.0.0.1:${QDRANT_PORT:-6333}:6333
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # The image ships without curl or wget: bash's /dev/tcp sends the request.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3
          && grep -q "200 OK" <&3'
      interval: 5s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-f1}
    ports:
      # Not 5432, which a local PostgreSQL install usually holds.
      - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
    volumes:
      # PostgreSQL 18 stores data under /var/lib/postgresql/<major>/, hence the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3 store of the race data lake: SeaweedFS in one process, as in llmops-gateway and llmops-platform (ADR-018):
  # MinIO no longer ships images. The key pair from the environment becomes its admin identity; the app creates
  # the bucket on its first write.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-ip.bind=0.0.0.0"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY:-f1}
      AWS_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_KEY:?set LAKE_S3_SECRET_KEY in .env}
    ports:
      # Not 8333, which the S3 store of llmops-gateway's Langfuse holds on the host.
      - 127.0.0.1:${LAKE_S3_PORT:-8334}:8333
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  qdrant-data:
  postgres-data:
  s3-data:
