# Install once: just hooks
# Run on every file: just lint
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Written by pnpm.
        exclude: ^web/pnpm-lock\.yaml$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # The front's lint and format, with web/biome.json. Same version as web/package.json's (Renovate groups them); the
  # hook installs its own copy, so pre-commit needs no `pnpm install`.
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-check
        # From web/, where biome.json is: Biome reads its configuration from the folder it runs in.
        entry: bash -c 'cd web && exec biome check --write --files-ignore-unknown=true --no-errors-on-unmatched "${@#web/}"' --
        additional_dependencies: ["@biomejs/biome@2.5.15"]
        files: ^web/

  # Runs in the project's virtualenv (uv.lock), so it sees the real dependencies and their types.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
