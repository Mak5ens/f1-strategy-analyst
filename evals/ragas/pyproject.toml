[project]
name = "f1-ragas"
version = "0.1.0"
description = "Ragas scores of recorded answers: kept apart, since Ragas needs openai < 3 and the app openai 3"
requires-python = ">=3.12,<3.13"
dependencies = ["ragas==0.4.3"]

[tool.uv]
package = false
# Resolve as of Ragas 0.4.3's release: later langchain-community releases removed a module it imports.
exclude-newer = "2026-01-14T00:00:00Z"
