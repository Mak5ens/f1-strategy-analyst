name: Web

# The front (web/, LAB-187): lint, types, unit tests, the generated API client, then the end-to-end tests against
# the API. Only when web/ changes: an API change that the front's client misses already fails ci.yml's unit tests
# (tests/unit/test_api.py compares the API with web/openapi.json), and regenerating the client changes web/.
on:
  pull_request:
    paths: [web/**, .github/workflows/web.yml]
  push:
    branches: [main]
    paths: [web/**, .github/workflows/web.yml]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm at the version of package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - name: The API client is generated from web/openapi.json
        run: |
          pnpm gen-client
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || { echo "::error::src/lib/api/schema.d.ts is not generated from openapi.json: run just web-gen-client"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The API of this commit, which the page reads through the generated client.
      - name: Start the API
        working-directory: .
        run: |
          uv run --no-dev uvicorn f1.api:app --port 8000 > api.log 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:8000/healthz > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: pnpm test:e2e
        env:
          API_URL: http://localhost:8000
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
